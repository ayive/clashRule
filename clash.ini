; Clash 新规则 INI 版（2026-10-14，与 clash.yaml 同一套设计）
; 规则以 GEOSITE/GEOIP 内置分类为主：cn 大表直连、国外分类代理、AI 走家宽
; 用法：subconverter 自定义配置（config=本文件）

;规则集定义
;本地 / 局域网直连
ruleset=🎯 全球直连,[]DOMAIN,localhost
ruleset=🎯 全球直连,[]GEOSITE,private
ruleset=🎯 全球直连,[]IP-CIDR,127.0.0.0/8,no-resolve
ruleset=🎯 全球直连,[]IP-CIDR,::1/128,no-resolve
ruleset=🎯 全球直连,[]IP-CIDR,10.0.0.0/8,no-resolve
ruleset=🎯 全球直连,[]IP-CIDR,172.16.0.0/12,no-resolve
ruleset=🎯 全球直连,[]IP-CIDR,192.168.0.0/16,no-resolve
;广告拦截 + 隐私防护（EasyPrivacy 反追踪）
ruleset=🛑 广告拦截,[]GEOSITE,category-ads-all
ruleset=🛑 广告拦截,https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/BanEasyPrivacy.list
;AI（Gemini 等域名须排在 Google 大类之前）
ruleset=🤖 AI,[]DOMAIN-SUFFIX,gemini.google.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,aistudio.google.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,ai.google.dev
ruleset=🤖 AI,[]DOMAIN-SUFFIX,generativelanguage.googleapis.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,bard.google.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,deepmind.google
ruleset=🤖 AI,[]DOMAIN-SUFFIX,grok.com
ruleset=🤖 AI,[]DOMAIN-SUFFIX,x.ai
ruleset=🤖 AI,[]DOMAIN-SUFFIX,perplexity.ai
ruleset=🤖 AI,[]GEOSITE,openai
ruleset=🤖 AI,[]GEOSITE,anthropic
;流媒体 / 社交
ruleset=📺 流媒体,[]GEOSITE,youtube
ruleset=📺 流媒体,[]GEOSITE,netflix
ruleset=📺 流媒体,[]GEOSITE,disney
ruleset=📺 流媒体,[]GEOSITE,spotify
ruleset=🚀 节点选择,[]GEOSITE,twitter
ruleset=🚀 节点选择,[]GEOSITE,facebook
;常用服务
ruleset=🪁 Google,[]GEOSITE,google
ruleset=📲 Telegram,[]GEOSITE,telegram
ruleset=👾 GitHub,[]GEOSITE,github
ruleset=🎯 全球直连,[]GEOSITE,apple
ruleset=🎯 全球直连,[]GEOSITE,microsoft
;兜底分流（cn 大表优先，geolocation-cn 不全只能做补充）
ruleset=🎯 全球直连,[]GEOSITE,cn
ruleset=🎯 全球直连,[]GEOSITE,geolocation-cn
ruleset=🎯 全球直连,[]GEOIP,CN,no-resolve
ruleset=🚀 节点选择,[]GEOSITE,geolocation-!cn
ruleset=🐟 漏网之鱼,[]FINAL

;策略组定义
custom_proxy_group=🚀 节点选择`select`[]⚡️ 自动优选`[]🏠 家宽节点`[]🪬 手动切换`[]DIRECT
custom_proxy_group=⚡️ 自动优选`url-test`^(?!.*(家宽|IPv6)).+$`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🏠 家宽节点`select`(家宽)
custom_proxy_group=🪬 手动切换`select`.*
custom_proxy_group=🤖 AI`select`[]🏠 家宽节点`[]🚀 节点选择`[]🪬 手动切换
custom_proxy_group=🪁 Google`select`[]🚀 节点选择`[]🪬 手动切换`[]DIRECT
custom_proxy_group=📺 流媒体`select`[]🚀 节点选择`[]🏠 家宽节点`[]🪬 手动切换
custom_proxy_group=📲 Telegram`select`[]🚀 节点选择`[]🪬 手动切换
custom_proxy_group=👾 GitHub`select`[]🚀 节点选择`[]🪬 手动切换`[]DIRECT
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择`[]🪬 手动切换
custom_proxy_group=🛑 广告拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]🏠 家宽节点`[]🪬 手动切换`[]DIRECT

enable_rule_generator=true
overwrite_original_rules=true
