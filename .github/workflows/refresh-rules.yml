name: Refresh rule lists

# 每天 12:00 CST 把上游 .list 重新包上 payload: 写回 clash/ 目录
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Re-wrap upstream lists with payload
        run: |
          python3 - <<'EOF'
          import urllib.request

          SOURCES = {
              "yu00": "https://raw.githubusercontent.com/ayive/clashRule/refs/heads/main/game_block.list",
              "yu01": "https://raw.githubusercontent.com/ayive/clashRule/refs/heads/main/proxy.list",
              "yu02": "https://raw.githubusercontent.com/ayive/clashRule/refs/heads/main/direct.list",
              "yu03": "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list",
              "yu04": "https://raw.githubusercontent.com/LingJingMaster/Shadowrocket-Rules/refs/heads/main/Google.list",
              "yu05": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Google/Google.list",
              "yu06": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Shadowrocket/BlockHttpDNS/BlockHttpDNS.list",
              "yu07": "https://raw.githubusercontent.com/LingJingMaster/Shadowrocket-Rules/refs/heads/main/AI.list",
              "yu08": "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/AI.list",
              "yu13": "https://raw.githubusercontent.com/ayive/clashRule/refs/heads/main/qwen.list",
              "yu14": "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list",
              "yu15": "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanEasyPrivacy.list",
              "yu16": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GitHub/GitHub.list",
              "yu18": "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Bing.list",
              "yu19": "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list",
              "yu20": "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list",
              "yu21": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Telegram/Telegram.list",
              "yu22": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Speedtest/Speedtest.list",
              "yu23": "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list",
              "yu24": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMedia/ChinaMedia.list",
              "yu25": "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list",
              "yu26": "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list",
              "yu27": "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list",
              "yu28": "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list",
              "yu29": "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Download.list",
              "yu30": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/China/China.list",
          }

          changed = []
          for name, url in SOURCES.items():
              req = urllib.request.Request(url, headers={"User-Agent": "clashRule-refresh"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  content = r.read().decode("utf-8", errors="replace")
              items = [ln.strip() for ln in content.splitlines()
                       if ln.strip() and not ln.strip().startswith(("#", ";"))]
              wrapped = "payload:\n" + "".join(
                  "  - '" + it.replace("'", "''") + "'\n" for it in items)
              path = f"clash/{name}.yaml"
              try:
                  old = open(path, encoding="utf-8").read()
              except FileNotFoundError:
                  old = ""
              if old != wrapped:
                  open(path, "w", encoding="utf-8").write(wrapped)
                  changed.append(f"{path} ({len(items)} rules)")
                  print(f"updated {path}: {len(items)} rules")
              else:
                  print(f"unchanged {path}")
          print("CHANGED:" if changed else "NO_CHANGES")
          for c in changed:
              print(" -", c)
          EOF


      - name: Sync to Cloudflare KV
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KV_NS: a1b17df9193a462a8ee4b37b61d5b2fd
        run: |
          put_kv() {
            local key="$1" file="$2"
            curl -s -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$KV_NS/values/$key" \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: text/yaml" \
              --data-binary "@$file" -o /dev/null -w "KV $key: %{http_code}\n"
          }
          for f in clash/yu*.yaml; do
            put_kv "$(basename "$f")" "$f"
          done
          declare -A BM=( [yu09]="OpenAI/OpenAI" [yu10]="Claude/Claude" [yu11]="Gemini/Gemini" [yu12]="Copilot/Copilot" [yu17]="GitHub/GitHub" )
          for k in "${!BM[@]}"; do
            if curl -s --max-time 60 "https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/${BM[$k]}.yaml" -o "/tmp/$k.yaml"; then
              put_kv "$k.yaml" "/tmp/$k.yaml"
            else
              echo "fetch failed: $k"
            fi
          done

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clash/
          git diff --cached --quiet && echo "no changes" || (git commit -m "chore: refresh rule lists $(date -u +%Y-%m-%d)" && git push)
