# Clash 配置（全新编写，2026-10-14）
# 思路：规则全部走 Mihomo 原生 geosite/geoip 二进制库，每日自动更新，匹配快、不臃肿
# 节点：优选 + 家宽一个订阅全包；AI 类服务默认走家宽（住宅 IP 兼容性最好）

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true

geodata-mode: true
geox-url:
  geoip: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
geo-auto-update: true
geo-update-interval: 24

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]

dns:
  enable: true
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
    - "time.*.com"
    - "ntp.*.com"
    - "+.pool.ntp.org"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - "https://dns.alidns.com/dns-query"
    - "https://doh.pub/dns-query"
  proxy-server-nameserver:
    - "https://dns.alidns.com/dns-query"
    - "https://doh.pub/dns-query"
  direct-nameserver:
    - "https://dns.alidns.com/dns-query"
    - "https://doh.pub/dns-query"
  nameserver-policy:
    "geosite:private":
      - "https://dns.alidns.com/dns-query"
    "geosite:cn":
      - "https://dns.alidns.com/dns-query"
      - "https://doh.pub/dns-query"
    "geosite:geolocation-cn":
      - "https://dns.alidns.com/dns-query"
      - "https://doh.pub/dns-query"
    "geosite:geolocation-!cn":
      - "https://1.1.1.1/dns-query"
      - "https://8.8.8.8/dns-query"

proxy-providers:
  all:
    type: http
    url: "https://emiz.dpdns.org/admin197011/sub?target=vg"
    path: ./providers/all.yaml
    interval: 3600
    health-check:
      enable: true
      url: "https://www.gstatic.com/generate_204"
      interval: 300
      timeout: 5000
      lazy: true

rule-providers:
  privacy:
    type: http
    behavior: classical
    format: text
    url: "https://cdn.jsdelivr.net/gh/ACL4SSR/ACL4SSR@master/Clash/BanEasyPrivacy.list"
    path: ./rules/privacy.list
    interval: 86400

proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies: [⚡️ 自动优选, 🏠 家宽节点, 🪬 手动切换, DIRECT]
  - name: ⚡️ 自动优选
    type: url-test
    use: [all]
    exclude-filter: "家宽|IPv6"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
  - name: 🏠 家宽节点
    type: select
    use: [all]
    filter: "家宽"
  - name: 🪬 手动切换
    type: select
    use: [all]
  - name: 🤖 AI
    type: select
    proxies: [🏠 家宽节点, 🚀 节点选择, 🪬 手动切换]
  - name: 🪁 Google
    type: select
    proxies: [🚀 节点选择, 🪬 手动切换, DIRECT]
  - name: 📺 流媒体
    type: select
    proxies: [🚀 节点选择, 🏠 家宽节点, 🪬 手动切换]
  - name: 📲 Telegram
    type: select
    proxies: [🚀 节点选择, 🪬 手动切换]
  - name: 👾 GitHub
    type: select
    proxies: [🚀 节点选择, 🪬 手动切换, DIRECT]
  - name: 🎯 全球直连
    type: select
    proxies: [DIRECT, 🚀 节点选择, 🪬 手动切换]
  - name: 🐟 漏网之鱼
    type: select
    proxies: [🚀 节点选择, 🏠 家宽节点, 🪬 手动切换, DIRECT]

rules:
  # ===== 本地 / 局域网直连 =====
  - DOMAIN,localhost,DIRECT
  - GEOSITE,private,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,::1/128,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  # ===== 广告拦截 / 隐私防护 =====
  - GEOSITE,category-ads-all,REJECT
  - RULE-SET,privacy,REJECT
  # ===== AI（Gemini 域名须排在 Google 大类之前） =====
  - DOMAIN-SUFFIX,gemini.google.com,🤖 AI
  - DOMAIN-SUFFIX,aistudio.google.com,🤖 AI
  - DOMAIN-SUFFIX,ai.google.dev,🤖 AI
  - DOMAIN-SUFFIX,generativelanguage.googleapis.com,🤖 AI
  - DOMAIN-SUFFIX,bard.google.com,🤖 AI
  - DOMAIN-SUFFIX,deepmind.google,🤖 AI
  - DOMAIN-SUFFIX,grok.com,🤖 AI
  - DOMAIN-SUFFIX,x.ai,🤖 AI
  - DOMAIN-SUFFIX,perplexity.ai,🤖 AI
  - GEOSITE,openai,🤖 AI
  - GEOSITE,anthropic,🤖 AI
  # ===== 流媒体 / 社交 =====
  - GEOSITE,youtube,📺 流媒体
  - GEOSITE,netflix,📺 流媒体
  - GEOSITE,disney,📺 流媒体
  - GEOSITE,spotify,📺 流媒体
  - GEOSITE,twitter,🚀 节点选择
  - GEOSITE,facebook,🚀 节点选择
  # ===== 常用服务 =====
  - GEOSITE,google,🪁 Google
  - GEOSITE,telegram,📲 Telegram
  - GEOSITE,github,👾 GitHub
  - GEOSITE,apple,🎯 全球直连
  - GEOSITE,microsoft,🎯 全球直连
  # ===== 兜底分流（cn 大表优先：geolocation-cn 仅 5 千余条不完整，cn 有 11 万条） =====
  - GEOSITE,cn,🎯 全球直连
  - GEOSITE,geolocation-cn,🎯 全球直连
  - GEOIP,CN,🎯 全球直连
  - GEOSITE,geolocation-!cn,🚀 节点选择
  - MATCH,🐟 漏网之鱼
