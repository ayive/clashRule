proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies: [🪬 手动切换, DIRECT]
  - name: 🪬 手动切换
    type: select
    use: [all]
  - name: 🪁 Google
    type: select
    proxies: [🚀 节点选择, 🪬 手动切换, DIRECT]
  - name: 📹 YouTube
    type: select
    proxies: [🚀 节点选择, 🪬 手动切换, DIRECT]
  - name: 🤖 AI
    type: select
    proxies: [🚀 节点选择, 🪬 手动切换]
