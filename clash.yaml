    type: select
    proxies: [🚀 节点选择, 🪬 手动切换]
  - name: 🪟 Microsoft
    type: select
    proxies: [🚀 节点选择, 🪬 手动切换, DIRECT]
  - name: 👾 GitHub
    type: select
    proxies: [🚀 节点选择, 🪬 手动切换, DIRECT]
  - name: 🍎 Apple
    type: select
    proxies: [DIRECT, 🪬 手动切换, 🚀 节点选择]
  - name: ♻️ Speedtest
    type: select
    proxies: [DIRECT, 🪬 手动切换, 🚀 节点选择]
  - name: 📲 Telegram
    type: select
