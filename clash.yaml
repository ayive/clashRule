# AnyuClash — Mihomo (Clash) 配置 v2
# 2026-10-14 重写，替代旧 YuRule 覆写（31 个 classical 规则集，含坏文件与超大文件）
# 特点：规则走 geosite/geoip 二进制库（快、不卡）；节点含优选+家宽，一个订阅全包
# 导入：Clash Party / Clash Verge 等 Mihomo 客户端直接导入本文件即可

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true

geodata-mode: true
geox-url:
  geoip: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb"
geo-auto-update: true
geo-update-interval: 24

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]

dns:
  enable: true
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
    - "time.*.com"
    - "ntp.*.com"
    - "+.pool.ntp.org"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - "https://dns.alidns.com/dns-query"
    - "https://doh.pub/dns-query"
  proxy-server-nameserver:
    - "https://dns.alidns.com/dns-query"
    - "https://doh.pub/dns-query"
  direct-nameserver:
    - "https://dns.alidns.com/dns-query"
    - "https://doh.pub/dns-query"
  nameserver-policy:
    "geosite:private":
      - "https://dns.alidns.com/dns-query"
    "geosite:geolocation-cn":
      - "https://dns.alidns.com/dns-query"
      - "https://doh.pub/dns-query"
    "geosite:geolocation-!cn":
      - "https://1.1.1.1/dns-query"
      - "https://8.8.8.8/dns-query"

proxy-providers:
  all:
    type: http
    url: "https://emiz.dpdns.org/admin197011/sub?target=vg"
    path: ./providers/all.yaml
    interval: 3600
    health-check:
      enable: true
      url: "https://www.gstatic.com/generate_204"
      interval: 300
      timeout: 5000
      lazy: true

proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies: [⚡️ 自动优选, 🏠 家宽节点, 🪬 手动切换, DIRECT]
  - name: ⚡️ 自动优选
    type: url-test
    use: [all]
    exclude-filter: "家宽|IPv6"
    url: "https://www.gstatic.com/generate_204"
    interval: 300
    tolerance: 50
  - name: 🏠 家宽节点
    type: select
    use: [all]
    filter: "家宽"
  - name: 🪬 手动切换
    type: select
    use: [all]
  - name: 🤖 AI
    type: select
    proxies: [🏠 家宽节点, 🚀 节点选择, 🪬 手动切换]
  - name: 🪁 Google
    type: select
    proxies: [🚀 节点选择, 🪬 手动切换, DIRECT]
  - name: 📹 YouTube
    type: select
    proxies: [🚀 节点选择, 🪬 手动切换, DIRECT]
  - name: 🌍 国外媒体
    type: select
    proxies: [🚀 节点选择, 🪬 手动切换]
  - name: 📲 Telegram
    type: select
    proxies: [🚀 节点选择, 🪬 手动切换]
  - name: 👾 GitHub
    type: select
    proxies: [🚀 节点选择, 🪬 手动切换, DIRECT]
  - name: 🪟 Microsoft
    type: select
    proxies: [🚀 节点选择, 🪬 手动切换, 🎯 全球直连]
  - name: 🍎 Apple
    type: select
    proxies: [🎯 全球直连, 🚀 节点选择, 🪬 手动切换]
  - name: 🎯 全球直连
    type: select
    proxies: [DIRECT, 🚀 节点选择, 🪬 手动切换]
  - name: 🐟 漏网之鱼
    type: select
    proxies: [🚀 节点选择, 🏠 家宽节点, 🪬 手动切换, DIRECT]

rules:
  # ===== 本地 / 局域网 =====
  - DOMAIN,localhost,DIRECT
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,::1/128,DIRECT,no-resolve
  - GEOSITE,private,DIRECT
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  # ===== 广告拦截 =====
