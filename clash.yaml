# YuRule — Mihomo (Clash) 配置
# 2026-10-14 按 YuRule.ini 原样重做：策略组、规则集、顺序、来源与 INI 完全一致
# 修的只是实现层：上游改走 jsdelivr（永远最新、无坏文件），自己的 4 个 list 内联进配置
# 导入：Clash Party / Clash Verge 等 Mihomo 客户端直接导入本文件

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]

dns:
  enable: true
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
    - "time.*.com"
    - "ntp.*.com"
    - "+.pool.ntp.org"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - "https://dns.alidns.com/dns-query"
    - "https://doh.pub/dns-query"
  proxy-server-nameserver:
    - "https://dns.alidns.com/dns-query"
  direct-nameserver:
    - "https://dns.alidns.com/dns-query"

proxy-providers:
  all:
    type: http
    url: "https://emiz.dpdns.org/admin197011/sub?target=vg"
    path: ./providers/all.yaml
    interval: 3600
    health-check:
      enable: true
      url: "https://www.gstatic.com/generate_204"
      interval: 300
      timeout: 5000
      lazy: true

